        // アイコンコンポーネント（Lucideを使用）
        const LucideIcon = ({ name, className = "w-5 h-5" }) => {
            React.useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            
            const iconMap = {
                'CakeSlice': 'cake-slice',
                'Bread': 'croissant',
                'Utensils': 'utensils',
                'Coffee': 'coffee',
                'IceCream': 'ice-cream',
                'Candy': 'candy',
                'BookOpen': 'book-open',
                'Store': 'store',
                'Beer': 'beer',
                'Pizza': 'pizza',
                'GlassWater': 'glass-water',
                'ShoppingBag': 'shopping-bag'
            };
            
            const dataLucide = iconMap[name] || 'circle';
            return <i data-lucide={dataLucide} className={className}></i>;
        };

        function App() {
            const [selectedCategory, setSelectedCategory] = useState('all');
            const [searchQuery, setSearchQuery] = useState('');
            const [isDarkMode, setIsDarkMode] = useState(false);
            const [selectedStore, setSelectedStore] = useState(null);
            
            const [isLiveMode, setIsLiveMode] = useState(true);
            const [simulatedDay, setSimulatedDay] = useState('weekday');
            const [simulatedHour, setSimulatedHour] = useState(12);
            const [simulatedMinute, setSimulatedMinute] = useState(0);

            const [realTime, setRealTime] = useState(new Date());
            const [toastMessage, setToastMessage] = useState('');

            useEffect(() => {
                const timer = setInterval(() => {
                    setRealTime(new Date());
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDarkMode]);

            const currentDayType = useMemo(() => {
                if (isLiveMode) {
                    const day = realTime.getDay();
                    return (day === 0 || day === 6) ? 'weekend' : 'weekday';
                }
                return simulatedDay;
            }, [isLiveMode, realTime, simulatedDay]);

            const currentHour = useMemo(() => {
                if (isLiveMode) return realTime.getHours();
                return simulatedHour;
            }, [isLiveMode, realTime, simulatedHour]);

            const currentMinute = useMemo(() => {
                if (isLiveMode) return realTime.getMinutes();
                return simulatedMinute;
            }, [isLiveMode, realTime, simulatedMinute]);

            const copyToClipboard = (store, e) => {
                e.stopPropagation();
                const textToCopy = `【${store.name} (${store.japaneseName})】\nエリアコード: ${store.code}\n営業時間: ${getFormattedHours(store)}\nコンセプト: ${store.description}`;
                
                const textArea = document.createElement("textarea");
                textArea.value = textToCopy;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast('エリア情報をコピーしました！');
                } catch (err) {
                    console.error('コピーに失敗しました', err);
                }
                document.body.removeChild(textArea);
            };

            const showToast = (message) => {
                setToastMessage(message);
                setTimeout(() => {
                    setToastMessage('');
                }, 3000);
            };

            const getFormattedHours = (store) => {
                if (store.openTimeWeekend) {
                    return `平日 ${store.openTime} - ${store.closeTime} / 土日 ${store.openTimeWeekend} - ${store.closeTime}`;
                }
                return `${store.openTime} - ${store.closeTime}`;
            };

            const checkIsOpen = (store, hour, minute, dayType) => {
                const openStr = (dayType === 'weekend' && store.openTimeWeekend) ? store.openTimeWeekend : store.openTime;
                const closeStr = store.closeTime;

                const [oH, oM] = openStr.split(':').map(Number);
                const [cH, cM] = closeStr.split(':').map(Number);

                const currentVal = hour * 60 + minute;
                const openVal = oH * 60 + oM;
                let closeVal = cH * 60 + cM;

                if (closeVal < openVal) {
                    closeVal += 24 * 60;
                }

                return currentVal >= openVal && currentVal < closeVal;
            };

            const filteredStores = useMemo(() => {
                return AREA_DATA.filter(store => {
                    if (selectedCategory !== 'all') {
                        if (selectedCategory === 'open') {
                            if (!checkIsOpen(store, currentHour, currentMinute, currentDayType)) return false;
                        } else if (store.category !== selectedCategory) {
                            return false;
                        }
                    }
                    if (searchQuery.trim() !== '') {
                        const query = searchQuery.toLowerCase();
                        return (
                            store.name.toLowerCase().includes(query) ||
                            store.japaneseName.includes(query) ||
                            store.code.toLowerCase().includes(query) ||
                            store.description.includes(query)
                        );
                    }
                    return true;
                });
            }, [selectedCategory, searchQuery, currentHour, currentMinute, currentDayType]);

            const storeStatuses = useMemo(() => {
                const statuses = {};
                AREA_DATA.forEach(store => {
                    const isOpen = checkIsOpen(store, currentHour, currentMinute, currentDayType);
                    
                    const openStr = (currentDayType === 'weekend' && store.openTimeWeekend) ? store.openTimeWeekend : store.openTime;
                    const closeStr = store.closeTime;
                    const [oH, oM] = openStr.split(':').map(Number);
                    const [cH, cM] = closeStr.split(':').map(Number);

                    const currentVal = currentHour * 60 + currentMinute;
                    const openVal = oH * 60 + oM;
                    let closeVal = cH * 60 + cM;
                    if (closeVal < openVal) closeVal += 24 * 60;

                    let timeDiffText = '';
                    if (isOpen) {
                        const diffMin = closeVal - currentVal;
                        const diffH = Math.floor(diffMin / 60);
                        const diffM = diffMin % 60;
                        timeDiffText = diffH > 0 ? `あと ${diffH}時間${diffM}分で終了` : `あと ${diffM}分で終了`;
                    } else {
                        if (currentVal < openVal) {
                            const diffMin = openVal - currentVal;
                            const diffH = Math.floor(diffMin / 60);
                            const diffM = diffMin % 60;
                            timeDiffText = diffH > 0 ? `開店まで あと ${diffH}時間${diffM}分` : `開店まで あと ${diffM}分`;
                        } else {
                            const diffMin = (24 * 60 - currentVal) + openVal;
                            const diffH = Math.floor(diffMin / 60);
                            const diffM = diffMin % 60;
                            timeDiffText = `明日開店まで ${diffH}時間${diffM}分`;
                        }
                    }

                    statuses[store.id] = { isOpen, timeDiffText };
                });
                return statuses;
            }, [currentHour, currentMinute, currentDayType]);

            const totalCount = AREA_DATA.length;
            const openCount = Object.values(storeStatuses).filter(s => s.isOpen).length;

            return (
                <div className="min-h-screen pb-20 transition-all duration-300">
                    
                    {/* トースト通知 */}
                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 z-50 bg-stone-900 text-stone-100 dark:bg-stone-100 dark:text-stone-900 px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 text-sm font-medium border border-stone-800 dark:border-stone-200">
                            <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {/* ナビゲーション */}
                    <nav className="sticky top-0 z-40 backdrop-blur-md bg-stone-50/80 dark:bg-stone-950/80 border-b border-stone-200/50 dark:border-stone-900/50 transition-all">
                        <div className="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex justify-between items-center">
                            <div className="flex items-center space-x-3">
                                <span className="font-serif tracking-widest font-bold text-lg text-stone-900 dark:text-stone-100">OGAWA COFFEE LABORATORY</span>
                                <span className="text-xs px-2 py-0.5 bg-stone-200 dark:bg-stone-800 rounded font-medium text-stone-600 dark:text-stone-400">非公式ガイド</span>
                            </div>
                            
                            <div className="flex items-center space-x-4">
                                {/* クロック表示 */}
                                <div className="hidden md:flex items-center space-x-2 text-xs font-mono text-stone-500 dark:text-stone-400">
                                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
                                    <span>REAL TIME:</span>
                                    <span className="font-semibold text-stone-700 dark:text-stone-300">
                                        {realTime.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}
                                    </span>
                                </div>

                                {/* ダークモード切替ボタン */}
                                <button 
                                    onClick={() => setIsDarkMode(!isDarkMode)} 
                                    className="p-2 rounded-lg bg-stone-200/60 dark:bg-stone-800/60 hover:bg-stone-300/60 dark:hover:bg-stone-700/60 transition-colors"
                                    title="テーマの切り替え"
                                >
                                    {isDarkMode ? (

                                            <div className="p-2.5 bg-amber-50 dark:bg-amber-950/20 text-amber-800 dark:text-amber-500 rounded-xl">
                                                <LucideIcon name={selectedStore.icon} className="w-5 h-5" />
                                            </div>
                                            <div>
                                                <h3 className="font-serif text-lg font-bold text-stone-900 dark:text-stone-100">{selectedStore.name}</h3>
                                                <p className="text-[10px] text-stone-400 dark:text-stone-500 uppercase tracking-wider">{selectedStore.japaneseName}</p>
                                            </div>
                                        </div>
                                        <button 
                                            onClick={() => setSelectedStore(null)}
                                            className="p-1.5 rounded-full hover:bg-stone-200/60 dark:hover:bg-stone-800/60 text-stone-400 hover:text-stone-600 dark:hover:text-stone-200 transition-colors"
                                        >
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                        </button>
                                    </div>

                                    <div className="p-8 space-y-6">
                                        
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-stone-50 dark:bg-stone-950/40 p-4 rounded-2xl border border-stone-100 dark:border-stone-850">
                                                <span className="text-[10px] font-semibold text-stone-400 dark:text-stone-500 block mb-1 uppercase tracking-wider">エリアコード</span>
                                                <span className="font-mono text-base font-bold text-amber-800 dark:text-amber-500">{selectedStore.code}</span>
                                            </div>

                                            <div className="bg-stone-50 dark:bg-stone-950/40 p-4 rounded-2xl border border-stone-100 dark:border-stone-850">
                                                <span className="text-[10px] font-semibold text-stone-400 dark:text-stone-500 block mb-1 uppercase tracking-wider">営業時間</span>
                                                <span className="font-mono text-sm font-bold text-stone-800 dark:text-stone-200">{getFormattedHours(selectedStore)}</span>
                                            </div>
                                        </div>

                                        <div className="space-y-2">
                                            <h4 className="text-xs font-semibold text-stone-400 dark:text-stone-500 uppercase tracking-wider">エリア説明</h4>
                                            <p className="text-sm text-stone-600 dark:text-stone-300 leading-relaxed font-light">
                                                {selectedStore.description}
                                            </p>
                                        </div>

                                        {selectedStore.recommended && (
                                            <div className="space-y-2">
                                                <h4 className="text-xs font-semibold text-stone-400 dark:text-stone-500 uppercase tracking-wider">おすすめメニュー</h4>
                                                <div className="flex items-center space-x-2 text-stone-800 dark:text-stone-200 text-sm bg-amber-50/30 dark:bg-amber-950/10 p-3 rounded-xl border border-amber-500/10">
                                                    <span className="text-base">✦</span>
                                                    <span className="font-medium">{selectedStore.recommended}</span>
                                                </div>
                                            </div>
                                        )}

                                        {selectedStore.codeMeaning && (
                                            <div className="space-y-1 bg-stone-50 dark:bg-stone-950/40 p-3.5 rounded-xl border border-stone-100 dark:border-stone-800/40">
                                                <span className="text-[10px] font-semibold text-amber-800 dark:text-amber-500 uppercase tracking-wider block">Code Breakdown（コードの解説）</span>
                                                <p className="text-[11px] text-stone-500 dark:text-stone-400 leading-relaxed">
                                                    {selectedStore.codeMeaning}
                                                </p>
                                            </div>
                                        )}

                                    </div>

                                    <div className="py-4 px-8 border-t border-stone-100 dark:border-stone-800/85 bg-stone-50/50 dark:bg-stone-900/40 flex justify-between items-center">
                                        <span className={`inline-flex items-center space-x-1.5 px-3 py-1 rounded-full text-xs font-semibold ${
                                            storeStatuses[selectedStore.id].isOpen 
                                                ? 'bg-emerald-50 dark:bg-emerald-950/20 text-emerald-600 dark:text-emerald-400' 
                                                : 'bg-stone-100 dark:bg-stone-800 text-stone-400 dark:text-stone-500'
                                        }`}>
                                            <span className={`w-1.5 h-1.5 rounded-full ${storeStatuses[selectedStore.id].isOpen ? 'bg-emerald-500' : 'bg-stone-400'}`}></span>
                                            <span>{storeStatuses[selectedStore.id].isOpen ? '現在 営業中' : '現在 準備中'}</span>
                                        </span>

                                        <div className="flex space-x-3">
                                            <button 
                                                onClick={(e) => copyToClipboard(selectedStore, e)}
                                                className="px-4 py-2 bg-stone-100 hover:bg-stone-200 dark:bg-stone-800 dark:hover:bg-stone-700 text-stone-700 dark:text-stone-300 text-xs font-semibold rounded-xl transition-all flex items-center space-x-1.5"
                                            >
                                                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                                                <span>コピー</span>
                                            </button>
                                            <button 
                                                onClick={() => setSelectedStore(null)}
                                                className="px-4 py-2 bg-amber-900 hover:bg-amber-850 dark:bg-amber-800 dark:hover:bg-amber-700 text-white text-xs font-semibold rounded-xl transition-all"
                                            >
                                                閉じる
                                            </button>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        )}

                        {/* 元資料・マップセクション（画像の追加） */}
                        <section className="mt-16 bg-white dark:bg-stone-900 border border-stone-200/60 dark:border-stone-800 rounded-3xl p-6 sm:p-10 shadow-lg flex flex-col items-center">
                            <div className="w-full text-left mb-6">
                                <span className="text-xs uppercase tracking-[0.2em] text-amber-800 dark:text-amber-500 font-bold block mb-2">SOURCE DATA</span>
                                <h2 className="font-serif text-2xl font-semibold text-stone-900 dark:text-stone-100">
                                    マップ
                                </h2>
                                <div className="text-xs text-stone-500 dark:text-stone-400 mt-2 space-y-1">
                                    <p>個人で手元に記録していた、全12エリアの系統コードと営業時間の対比一覧表（2026年5月31日時点）です。</p>
                                    <p className="pt-1">
                                        <span>詳細・最新の公式情報は公式サイトをご覧ください：</span>
                                        <a 
                                            href="https://www.oc-ogawa.co.jp/ocl-takanawa/" 
                                            target="_blank" 
                                            rel="noopener noreferrer" 
                                            className="text-amber-800 dark:text-amber-500 font-semibold underline hover:text-amber-700 dark:hover:text-amber-400 transition-colors ml-1"
                                        >
                                            https://www.oc-ogawa.co.jp/ocl-takanawa/
                                        </a>
                                    </p>
                                </div>
                            </div>
                            
                            <div className="w-full max-w-2xl overflow-hidden rounded-2xl border border-stone-200 dark:border-stone-800 bg-stone-100 dark:bg-stone-950 p-2 shadow-inner">
                                <img 
                                    src="ogawa-map.jpeg" 
                                    alt="元資料の営業時間表" 
                                    className="w-full h-auto max-h-[400px] object-cover object-center rounded-xl filter contrast-[1.02] brightness-[0.99] transition-all duration-300 dark:opacity-90"
                                    onError={(e) => {
                                        e.target.style.display = 'none';
                                    }}
                                />
                            </div>
                        </section>

                    </main>

                    {/* フッター */}
                    <footer className="mt-20 border-t border-stone-200/50 dark:border-stone-900/50 pt-8 text-center text-xs text-stone-400 dark:text-stone-500">
                        <div className="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center space-y-4 sm:space-y-0">
                            <div>
                                <p>© 2026 OGAWA COFFEE LABORATORY 営業時間備忘録 (非公式ファンページ / 2026年5月31日時点の情報)</p>
                            </div>
                            <div className="flex space-x-6">
                                <span className="font-mono text-stone-500">※当サイトの内容は個人の調査による備忘録です。最新の正確な情報は公式発表をご確認ください。</span>
                            </div>
                        </div>
                    </footer>

                </div>
            );
        }

        // Reactマウント
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

        // アイコンコンポーネント
        const LucideIcon = ({ name, className = "w-5 h-5" }) => {
            React.useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            
            const iconMap = {
                'CakeSlice': 'cake-slice',
                'Bread': 'croissant',
                'Utensils': 'utensils',
                'Coffee': 'coffee',
                'IceCream': 'ice-cream',
                'Candy': 'candy',
                'BookOpen': 'book-open',
                'Store': 'store',
                'Beer': 'beer',
                'Pizza': 'pizza',
                'GlassWater': 'glass-water',
                'ShoppingBag': 'shopping-bag'
            };
            
            const dataLucide = iconMap[name] || 'circle';
            return <i data-lucide={dataLucide} className={className}></i>;
        };

        function App() {
            const [selectedCategory, setSelectedCategory] = useState('all');
            const [searchQuery, setSearchQuery] = useState('');
            const [isDarkMode, setIsDarkMode] = useState(false);
            const [selectedStore, setSelectedStore] = useState(null);
            
            const [isLiveMode, setIsLiveMode] = useState(true);
            const [simulatedDay, setSimulatedDay] = useState('weekday');
            const [simulatedHour, setSimulatedHour] = useState(12);
            const [simulatedMinute, setSimulatedMinute] = useState(0);
            const [realTime, setRealTime] = useState(new Date());
            const [toastMessage, setToastMessage] = useState('');

            useEffect(() => {
                const timer = setInterval(() => {
                    setRealTime(new Date());
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDarkMode]);

            const currentDayType = useMemo(() => {
                if (isLiveMode) {
                    const day = realTime.getDay();
                    return (day === 0 || day === 6) ? 'weekend' : 'weekday';
                }
                return simulatedDay;
            }, [isLiveMode, realTime, simulatedDay]);

            const currentHour = useMemo(() => {
                if (isLiveMode) return realTime.getHours();
                return simulatedHour;
            }, [isLiveMode, realTime, simulatedHour]);

            const currentMinute = useMemo(() => {
                if (isLiveMode) return realTime.getMinutes();
                return simulatedMinute;
            }, [isLiveMode, realTime, simulatedMinute]);

            const copyToClipboard = (store, e) => {
                e.stopPropagation();
                const textToCopy = `【${store.name} (${store.japaneseName})】\nエリアコード: ${store.code}\n営業時間: ${getFormattedHours(store)}\nコンセプト: ${store.description}`;
                
                const textArea = document.createElement("textarea");
                textArea.value = textToCopy;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast('エリア情報をコピーしました！');
                } catch (err) {
                    console.error('コピーに失敗しました', err);
                }
                document.body.removeChild(textArea);
            };

            const showToast = (message) => {
                setToastMessage(message);
                setTimeout(() => {
                    setToastMessage('');
                }, 3000);
            };

            const getFormattedHours = (store) => {
                if (store.openTimeWeekend) {
                    return `平日 ${store.openTime} - ${store.closeTime} / 土日 ${store.openTimeWeekend} - ${store.closeTime}`;
                }
                return `${store.openTime} - ${store.closeTime}`;
            };

            const checkIsOpen = (store, hour, minute, dayType) => {
                const openStr = (dayType === 'weekend' && store.openTimeWeekend) ? store.openTimeWeekend : store.openTime;
                const closeStr = store.closeTime;

                const [oH, oM] = openStr.split(':').map(Number);
                const [cH, cM] = closeStr.split(':').map(Number);

                const currentVal = hour * 60 + minute;
                const openVal = oH * 60 + oM;
                let closeVal = cH * 60 + cM;

                if (closeVal < openVal) {
                    closeVal += 24 * 60;
                }

                return currentVal >= openVal && currentVal < closeVal;
            };

            const filteredStores = useMemo(() => {
                return AREA_DATA.filter(store => {
                    if (selectedCategory !== 'all') {
                        if (selectedCategory === 'open') {
                            if (!checkIsOpen(store, currentHour, currentMinute, currentDayType)) return false;
                        } else if (store.category !== selectedCategory) {
                            return false;
                        }
                    }
                    if (searchQuery.trim() !== '') {
                        const query = searchQuery.toLowerCase();
                        return (
                            store.name.toLowerCase().includes(query) ||
                            store.japaneseName.includes(query) ||
                            store.code.toLowerCase().includes(query) ||
                            store.description.includes(query)
                        );
                    }
                    return true;
                });
            }, [selectedCategory, searchQuery, currentHour, currentMinute, currentDayType]);

            const storeStatuses = useMemo(() => {
                const statuses = {};
                AREA_DATA.forEach(store => {
                    const isOpen = checkIsOpen(store, currentHour, currentMinute, currentDayType);
                    
                    const openStr = (currentDayType === 'weekend' && store.openTimeWeekend) ? store.openTimeWeekend : store.openTime;
                    const closeStr = store.closeTime;
                    const [oH, oM] = openStr.split(':').map(Number);
                    const [cH, cM] = closeStr.split(':').map(Number);

                    const currentVal = currentHour * 60 + currentMinute;
                    const openVal = oH * 60 + oM;
                    let closeVal = cH * 60 + cM;
                    if (closeVal < openVal) closeVal += 24 * 60;

                    let timeDiffText = '';
                    if (isOpen) {
                        const diffMin = closeVal - currentVal;
                        const diffH = Math.floor(diffMin / 60);
                        const diffM = diffMin % 60;
                        timeDiffText = diffH > 0 ? `あと ${diffH}時間${diffM}分で終了` : `あと ${diffM}分で終了`;
                    } else {
                        if (currentVal < openVal) {
                            const diffMin = openVal - currentVal;
                            const diffH = Math.floor(diffMin / 60);
                            const diffM = diffMin % 60;
                            timeDiffText = diffH > 0 ? `開店まで あと ${diffH}時間${diffM}分` : `開店まで あと ${diffM}分`;
                        } else {
                            const diffMin = (24 * 60 - currentVal) + openVal;
                            const diffH = Math.floor(diffMin / 60);
                            const diffM = diffMin % 60;
                            timeDiffText = `明日開店まで ${diffH}時間${diffM}分`;
                        }
                    }

                    statuses[store.id] = { isOpen, timeDiffText };
                });
                return statuses;
            }, [currentHour, currentMinute, currentDayType]);

            const totalCount = AREA_DATA.length;
            const openCount = Object.values(storeStatuses).filter(s => s.isOpen).length;

            return (
                <div className="min-h-screen pb-20 transition-all duration-300">
                    
                    {/* トースト通知 */}
                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 z-50 bg-stone-900 text-stone-100 dark:bg-stone-100 dark:text-stone-900 px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 text-sm font-medium border border-stone-800 dark:border-stone-200">
                            <span className="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
                            <span>{toastMessage}</span>

                    )}

                        <div className="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex justify-between items-center">
                            <div className="flex items-center space-x-3">
                                <span className="font-serif tracking-widest font-bold text-base sm:text-lg text-stone-900 dark:text-stone-100">OGAWA COFFEE LABORATORY</span>
                                <span className="text-[10px] px-2 py-0.5 bg-stone-200/60 dark:bg-stone-850 rounded font-medium text-stone-600 dark:text-stone-400">非公式ガイド</span>
                            </div>
                            
                            <div className="flex items-center space-x-4">
                                <div className="hidden md:flex items-center space-x-2 text-xs font-mono text-stone-500 dark:text-stone-400">
                                    <span className="w-2.5 h-2.5 rounded-full bg-amber-500/80 inline-block animate-pulse"></span>
                                    <span>REAL TIME:</span>
                                    <span className="font-semibold text-stone-700 dark:text-stone-300">
                                        {realTime.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}
                                    </span>
                                </div>

                                <button 
                                    onClick={() => setIsDarkMode(!isDarkMode)} 
                                    className="p-2 rounded-lg bg-stone-200/50 dark:bg-stone-900 hover:bg-stone-300/50 dark:hover:bg-stone-800 transition-colors"
                                    title="テーマの切り替え"
                                >
                                    {isDarkMode ? (
                                        <svg className="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 9h-1m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M14 12a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                                    ) : (
                                        <svg className="w-4 h-4 text-stone-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                                    )}
                                </button>
                            </div>
                        </div>
                    </nav>

                    {/* ヒーローヘッダー */}
                    <header className="relative py-14 sm:py-16 overflow-hidden border-b border-stone-200/40 dark:border-stone-900/40 bg-gradient-to-b from-stone-100/60 to-stone-50 dark:from-stone-900/40 dark:to-stone-950">
                        <div className="absolute inset-0 opacity-[0.02] dark:opacity-[0.04] pointer-events-none" style={{ backgroundImage: `radial-gradient(#a8835e 1px, transparent 1px)`, backgroundSize: '24px 24px' }}></div>
                        
                        <div className="max-w-4xl mx-auto px-4 sm:px-6 text-center relative z-10">
                            <p className="text-[10px] uppercase tracking-[0.3em] text-amber-700 dark:text-amber-500 font-semibold mb-2">Information Portal</p>
                            <h1 className="font-serif text-2xl sm:text-4xl font-normal tracking-widest text-stone-900 dark:text-stone-100 uppercase">
                                OGAWA COFFEE LABORATORY
                            </h1>
                            <div className="h-[1px] w-10 bg-amber-500/30 mx-auto my-5"></div>
                            
                            <p className="text-stone-500 dark:text-stone-400 leading-relaxed max-w-2xl mx-auto text-xs sm:text-sm font-light">
                                本サイトは、各ショップの営業時間をまとめた個人制作の非公式備忘録サイトです。
                            </p>
                            
                            <div className="mt-4 inline-block bg-stone-200/50 dark:bg-stone-900 rounded-lg px-3 py-1.5 text-[11px] text-stone-600 dark:text-stone-400">
                                📅 情報基準日: 2026年5月31日時点
                            </div>
                        </div>
                    </header>

                    {/* メインコンテンツ */}
                    <main className="max-w-6xl mx-auto px-4 sm:px-6 mt-8">

                        {/* コントロールパネル */}
                        <section className="bg-white dark:bg-stone-900 rounded-2xl border border-stone-200/60 dark:border-stone-850 p-5 sm:p-6 mb-6 shadow-sm">
                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-center">
                                
                                {/* 左側：シミュレーター */}
                                <div className="lg:col-span-7 space-y-4 border-b lg:border-b-0 lg:border-r border-stone-200/60 dark:border-stone-850 pb-6 lg:pb-0 lg:pr-8">
                                    <div className="flex justify-between items-center mb-1">
                                        <h3 className="text-xs font-semibold tracking-wide text-stone-700 dark:text-stone-300 flex items-center space-x-2">
                                            <svg className="w-3.5 h-3.5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                            <span>時間帯シミュレーター</span>
                                        </h3>
                                        
                                        <div className="flex space-x-1.5">
                                            <button 
                                                onClick={() => setIsLiveMode(true)}
                                                className={`text-[10px] px-2.5 py-1 rounded-md font-medium transition-all ${
                                                    isLiveMode 
                                                        ? 'bg-amber-700 text-white dark:bg-amber-600' 
                                                        : 'bg-stone-100 dark:bg-stone-800 text-stone-600 dark:text-stone-400 hover:bg-stone-200'
                                                }`}
                                            >
                                                ● LIVE
                                            </button>
                                            <button 
                                                onClick={() => setIsLiveMode(false)}
                                                className={`text-[10px] px-2.5 py-1 rounded-md font-medium transition-all ${
                                                    !isLiveMode 
                                                        ? 'bg-amber-700 text-white dark:bg-amber-600' 
                                                        : 'bg-stone-100 dark:bg-stone-800 text-stone-600 dark:text-stone-400 hover:bg-stone-200'
                                                }`}
                                            >
                                                時間調整
                                            </button>
                                        </div>
                                    </div>

                                    <div className={`space-y-3 transition-all duration-300 ${isLiveMode ? 'opacity-40 pointer-events-none' : 'opacity-100'}`}>
                                        <div className="flex items-center space-x-4">
                                            <span className="text-[11px] text-stone-400 w-12">曜日区分</span>
                                            <div className="flex bg-stone-100 dark:bg-stone-950 p-1 rounded-lg w-full max-w-xs border border-stone-200/30 dark:border-stone-850">
                                                <button 
                                                    onClick={() => !isLiveMode && setSimulatedDay('weekday')}
                                                    className={`flex-1 text-center py-1 text-xs rounded-md font-medium transition-all ${
                                                        simulatedDay === 'weekday' 
                                                            ? 'bg-white dark:bg-stone-800 text-stone-900 dark:text-white shadow-sm' 
                                                            : 'text-stone-400 hover:text-stone-600 dark:hover:text-stone-300'
                                                    }`}
                                                >
                                                    平日
                                                </button>
                                                <button 
                                                    onClick={() => !isLiveMode && setSimulatedDay('weekend')}
                                                    className={`flex-1 text-center py-1 text-xs rounded-md font-medium transition-all ${
                                                        simulatedDay === 'weekend' 
                                                            ? 'bg-white dark:bg-stone-800 text-stone-900 dark:text-white shadow-sm' 
                                                            : 'text-stone-400 hover:text-stone-600 dark:hover:text-stone-300'
                                                    }`}
                                                >
                                                    土日・祝日
                                                </button>
                                            </div>
                                        </div>

                                        <div className="space-y-1.5">
                                            <div className="flex justify-between items-center text-[11px] text-stone-400">
                                                <span>時間設定</span>
                                                <span className="font-mono font-bold text-amber-700 dark:text-amber-500 text-xs bg-amber-50 dark:bg-amber-950/40 px-2 py-0.5 rounded">
                                                    {String(simulatedHour).padStart(2, '0')}:{String(simulatedMinute).padStart(2, '0')}
                                                </span>
                                            </div>
                                            <input 
                                                type="range" 
                                                min="0" 
                                                max="1439" 
                                                value={simulatedHour * 60 + simulatedMinute}
                                                onChange={(e) => {
                                                    const val = Number(e.target.value);
                                                    setSimulatedHour(Math.floor(val / 60));
                                                    setSimulatedMinute(val % 60);
                                                }}
                                                disabled={isLiveMode}
                                                className="w-full h-1 bg-stone-200 dark:bg-stone-800 rounded-lg appearance-none cursor-pointer accent-amber-600 dark:accent-amber-500"
                                            />
                                        </div>
                                    </div>

                                    <div className="pt-2 flex items-center justify-between text-[11px] text-stone-450 border-t border-stone-100 dark:border-stone-850/60">
                                        <div>
                                            表示中: <span className="font-medium text-stone-700 dark:text-stone-300">
                                                {currentDayType === 'weekend' ? '土日・祝日' : '平日'} {String(currentHour).padStart(2, '0')}:{String(currentMinute).padStart(2, '0')}
                                            </span>
                                        </div>
                                        <div className="font-medium text-stone-600 dark:text-stone-400">
                                            {totalCount}エリア中、 <span className="text-emerald-600 dark:text-emerald-400 font-semibold">{openCount} エリア営業中</span>
                                        </div>
                                    </div>
                                </div>

                                {/* 右側：フィルター＆検索 */}
                                <div className="lg:col-span-5 space-y-3.5">
                                    <h3 className="text-xs font-semibold tracking-wide text-stone-700 dark:text-stone-300 flex items-center space-x-2">
                                        <svg className="w-3.5 h-3.5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                                        <span>エリア検索・絞り込み</span>
                                    </h3>

                                    <div className="relative">
                                        <input 
                                            type="text" 
                                            placeholder="エリア名、コード、キーワードで検索..."
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            className="w-full bg-stone-100 dark:bg-stone-950 border border-stone-200/50 dark:border-stone-850 rounded-xl py-2.5 pl-9 pr-8 text-xs focus:ring-1 focus:ring-amber-500 focus:outline-none text-stone-800 dark:text-stone-200 placeholder-stone-400"
                                        />
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-stone-400">
                                            <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                        </div>
                                        {searchQuery && (
                                            <button 
                                                onClick={() => setSearchQuery('')}
                                                className="absolute inset-y-0 right-0 pr-2.5 flex items-center text-stone-400 hover:text-stone-600"
                                            >
                                                ✕
                                            </button>
                                        )}
                                    </div>

                                    <div className="flex flex-wrap gap-1.5">
                                        {[
                                            { id: 'all', label: 'すべて' },
                                            { id: 'open', label: '営業中' },
                                            { id: 'cafe', label: 'カフェ・甘味' },
                                            { id: 'food', label: 'フード' },
                                            { id: 'bar', label: 'バー' },
                                            { id: 'lifestyle', label: 'ショップ' },
                                        ].map(tab => (
                                            <button
                                                key={tab.id}
                                                onClick={() => setSelectedCategory(tab.id)}
                                                className={`text-[10px] px-2.5 py-1.5 rounded-lg font-medium transition-colors ${
                                                    selectedCategory === tab.id
                                                        ? 'bg-stone-800 dark:bg-stone-200 text-white dark:text-stone-900'
                                                        : 'bg-stone-100 dark:bg-stone-950 border border-stone-200/20 dark:border-stone-850 hover:bg-stone-200 text-stone-600 dark:text-stone-400'
                                                }`}
                                            >
                                                {tab.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                            </div>
                        </section>

                        {/* メインテーブル */}
                        <div className="bg-white dark:bg-stone-900 rounded-2xl border border-stone-200/60 dark:border-stone-850 overflow-hidden shadow-sm mb-10">
                            
                            {/* モバイル表示用のカードレイアウト */}
                            <div className="block md:hidden divide-y divide-stone-100 dark:divide-stone-850">
                                {filteredStores.length > 0 ? (
                                    filteredStores.map(store => {
                                        const status = storeStatuses[store.id];
                                        return (
                                            <div 
                                                key={store.id} 
                                                onClick={() => setSelectedStore(store)}
                                                className="p-4 active:bg-stone-50 dark:active:bg-stone-950/40 transition-colors cursor-pointer"
                                            >
                                                <div className="flex justify-between items-start mb-2">
                                                    <div className="flex items-center space-x-2.5">
                                                        <div className="p-2 bg-stone-100 dark:bg-stone-950 text-amber-700 dark:text-amber-500 rounded-lg">
                                                            <LucideIcon name={store.icon} className="w-4 h-4" />
                                                        </div>
                                                        <div>
                                                            <h4 className="font-semibold text-xs text-stone-900 dark:text-stone-100">{store.name}</h4>
                                                            <span className="text-[10px] text-stone-400 block -mt-0.5">{store.japaneseName}</span>
                                                        </div>
                                                    </div>

                                                    <div>
                                                        <span className="inline-block px-1.5 py-0.5 bg-stone-100 dark:bg-stone-950 font-mono text-[9px] text-stone-400 dark:text-stone-500 rounded">
                                                            {store.code}
                                                        </span>
                                                    </div>
                                                </div>

                                                <div className="flex justify-between items-center text-xs mt-2 bg-stone-50 dark:bg-stone-950/40 p-2 rounded-lg border border-stone-100 dark:border-stone-850/40">
                                                    <div className="space-y-0.5">
                                                        <div className="font-mono text-stone-700 dark:text-stone-300 font-medium flex items-center space-x-1">
                                                            <span className="text-[11px]">{getFormattedHours(store)}</span>
                                                        </div>
                                                    </div>

                                                    <div className="text-right">
                                                        <span className={`inline-flex items-center space-x-1 px-2 py-0.5 rounded-full text-[9px] font-bold ${
                                                            status.isOpen 
                                                                ? 'bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600 dark:text-emerald-400' 
                                                                : 'bg-stone-100 dark:bg-stone-800 text-stone-400'
                                                        }`}>
                                                            <span>{status.isOpen ? '営業中' : '準備中'}</span>
                                                        </span>
                                                        <div className="text-[8px] text-stone-400 mt-0.5">{status.timeDiffText}</div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })
                                ) : (
                                    <div className="p-6 text-center text-stone-400 text-xs">
                                        該当するエリアが見つかりません。
                                    </div>
                                )}
                            </div>

                            {/* デスクトップ表示用のテーブル */}
                            <div className="hidden md:block overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="border-b border-stone-200 dark:border-stone-850 bg-stone-100/50 dark:bg-stone-950/50 text-[10px] font-semibold text-stone-500 uppercase tracking-wider">
                                            <th className="py-3 px-5 w-1/4">エリア名 / カテゴリー</th>
                                            <th className="py-3 px-5 w-1/6">エリアコード</th>
                                            <th className="py-3 px-5 w-1/4">営業時間</th>
                                            <th className="py-3 px-5 w-1/5">状況</th>
                                            <th className="py-3 px-4 text-center w-1/12">詳細</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-stone-100 dark:divide-stone-850">
                                        {filteredStores.length > 0 ? (
                                            filteredStores.map(store => {
                                                const status = storeStatuses[store.id];
                                                return (
                                                    <tr 
                                                        key={store.id} 
                                                        onClick={() => setSelectedStore(store)}
                                                        className="hover:bg-stone-50/60 dark:hover:bg-stone-950/20 transition-all cursor-pointer group"
                                                    >
                                                        <td className="py-3.5 px-5">
                                                            <div className="flex items-center space-x-3.5">
                                                                <div className="p-2 bg-stone-100 dark:bg-stone-950 text-stone-500 group-hover:text-amber-700 dark:group-hover:text-amber-500 rounded-lg transition-all">
                                                                    <LucideIcon name={store.icon} className="w-4 h-4" />
                                                                </div>
                                                                <div>
                                                                    <div className="font-semibold text-stone-900 dark:text-stone-100 text-xs flex items-center space-x-1">
                                                                        <span>{store.name}</span>
                                                                        <span className="text-[10px] font-normal text-stone-400">({store.japaneseName})</span>
                                                                    </div>
                                                                    <span className={`inline-block text-[8px] font-bold px-1.5 py-0.2 rounded-md mt-0.5 uppercase tracking-wider ${
                                                                        store.category === 'cafe' ? 'bg-amber-100/50 dark:bg-amber-950/30 text-amber-800' :
                                                                        store.category === 'food' ? 'bg-stone-100 dark:bg-stone-950 text-stone-600 dark:text-stone-400' :
                                                                        store.category === 'bar' ? 'bg-stone-100 dark:bg-stone-950 text-stone-600 dark:text-stone-400' :
                                                                        'bg-stone-100 dark:bg-stone-950 text-stone-600 dark:text-stone-400'
                                                                    }`}>
                                                                        {store.category === 'cafe' ? 'Café & Sweets' :
                                                                         store.category === 'food' ? 'Food & Kitchen' :
                                                                         store.category === 'bar' ? 'Beer & Wine Bar' :
                                                                         'Lifestyle & Shop'}
                                                                    </span>
                                                                </div>
                                                            </div>
                                                        </td>

                                                        <td className="py-3.5 px-5">
                                                            <span className="inline-block font-mono text-[11px] text-stone-500">
                                                                {store.code}
                                                            </span>
                                                        </td>

                                                        <td className="py-3.5 px-5">
                                                            <div className="font-mono text-xs text-stone-700 dark:text-stone-300">
                                                                <span>{getFormattedHours(store)}</span>
                                                            </div>
                                                        </td>

                                                        <td className="py-3.5 px-5">
                                                            <div className="inline-flex items-center space-x-2 px-2.5 py-1 rounded-full text-[10px] font-semibold bg-stone-50 dark:bg-stone-950 border border-stone-100 dark:border-stone-850">
                                                                <span className={`h-1.5 w-1.5 rounded-full ${status.isOpen ? 'bg-emerald-500 animate-pulse' : 'bg-stone-300'}`}></span>
                                                                <span className={status.isOpen ? 'text-emerald-600 dark:text-emerald-400' : 'text-stone-400'}>
                                                                    {status.isOpen ? '営業中' : '準備中'}
                                                                </span>
                                                            </div>
                                                            <div className="text-[9px] text-stone-400 mt-0.5 pl-1">
                                                                {status.timeDiffText}
                                                            </div>
                                                        </td>

                                                        <td className="py-3.5 px-4 text-center">
                                                            <div className="text-stone-300 group-hover:text-amber-700 dark:group-hover:text-amber-500 transition-colors flex justify-center">
                                                                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                );
                                            })
                                        ) : (
                                            <tr>
                                                <td colSpan="5" className="py-8 text-center text-stone-400 text-xs">
                                                    該当するエリアが見つかりません。
                                                </td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>

                        </div>

                        {/* エリア詳細モーダル */}
                        {selectedStore && (
                            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-950/50 backdrop-blur-sm">
                                <div className="bg-white dark:bg-stone-900 rounded-2xl max-w-md w-full border border-stone-200 dark:border-stone-800 shadow-xl overflow-hidden">
                                    
                                    <div className="relative py-4 px-5 border-b border-stone-100 dark:border-stone-850 bg-stone-50 dark:bg-stone-950/40 flex justify-between items-center">
                                        <div className="flex items-center space-x-2.5">
                                            <div className="p-2 bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-500 rounded-lg">
                                                <LucideIcon name={selectedStore.icon} className="w-4 h-4" />
                                            </div>
                                            <div>
                                                <h3 className="font-serif text-sm font-bold text-stone-900 dark:text-stone-100">{selectedStore.name}</h3>
                                                <p className="text-[9px] text-stone-400 uppercase tracking-wider -mt-0.5">{selectedStore.japaneseName}</p>
                                            </div>
                                        </div>
                                        <button 
                                            onClick={() => setSelectedStore(null)}
                                            className="p-1 text-stone-400 hover:text-stone-600"
                                        >
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                        </button>
                                    </div>

                                    <div className="p-5 space-y-4 text-xs">
                                        <div className="grid grid-cols-2 gap-3">
                                            <div className="bg-stone-50 dark:bg-stone-950/60 p-3 rounded-xl border border-stone-100 dark:border-stone-850">
                                                <span className="text-[9px] text-stone-400 block mb-0.5 uppercase tracking-wider">エリアコード</span>
                                                <span className="font-mono font-bold text-amber-700 dark:text-amber-500">{selectedStore.code}</span>
                                            </div>

                                            <div className="bg-stone-50 dark:bg-stone-950/60 p-3 rounded-xl border border-stone-100 dark:border-stone-850">
                                                <span className="text-[9px] text-stone-400 block mb-0.5 uppercase tracking-wider">営業時間</span>
                                                <span className="font-mono font-bold text-stone-700 dark:text-stone-300">{selectedStore.openTime} - {selectedStore.closeTime}</span>
                                            </div>
                                        </div>

                                        <div className="space-y-1">
                                            <h4 className="text-[9px] font-semibold text-stone-400 uppercase tracking-wider">説明</h4>
                                            <p className="text-stone-600 dark:text-stone-300 leading-relaxed font-light">
                                                {selectedStore.description}
                                            </p>
                                        </div>

                                        {selectedStore.recommended && (
                                            <div className="space-y-1">
                                                <h4 className="text-[9px] font-semibold text-stone-400 uppercase tracking-wider">おすすめメニュー</h4>
                                                <div className="text-stone-800 dark:text-stone-200 bg-amber-50/40 dark:bg-amber-950/20 p-2.5 rounded-lg border border-amber-500/5 font-medium">
                                                    ✦ {selectedStore.recommended}
                                                </div>
                                            </div>
                                        )}

                                        {selectedStore.codeMeaning && (
                                            <div className="space-y-0.5 bg-stone-50 dark:bg-stone-950/40 p-2.5 rounded-lg border border-stone-100 dark:border-stone-850/40 text-[10px]">
                                                <span className="text-[8px] font-semibold text-amber-700 dark:text-amber-500 block uppercase tracking-wider">コードの解説</span>
                                                <p className="text-stone-400 leading-relaxed">
                                                    {selectedStore.codeMeaning}
                                                </p>
                                            </div>
                                        )}
                                    </div>

                                    <div className="py-3 px-5 border-t border-stone-100 dark:border-stone-850 bg-stone-50 dark:bg-stone-950/40 flex justify-between items-center">
                                        <span className={`inline-flex items-center space-x-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold ${
                                            storeStatuses[selectedStore.id].isOpen 
                                                ? 'bg-emerald-50 dark:bg-emerald-950/20 text-emerald-600 dark:text-emerald-400' 
                                                : 'bg-stone-100 dark:bg-stone-800 text-stone-400'
                                        }`}>
                                            <span>{storeStatuses[selectedStore.id].isOpen ? '現在 営業中' : '現在 準備中'}</span>
                                        </span>

                                        <div className="flex space-x-2">
                                            <button 
                                                onClick={(e) => copyToClipboard(selectedStore, e)}
                                                className="px-3 py-1.5 bg-stone-100 hover:bg-stone-200 dark:bg-stone-800 text-stone-600 dark:text-stone-300 text-[11px] font-semibold rounded-lg flex items-center space-x-1"
                                            >
                                                <span>コピー</span>
                                            </button>
                                            <button 
                                                onClick={() => setSelectedStore(null)}
                                                className="px-3 py-1.5 bg-stone-800 dark:bg-stone-200 text-white dark:text-stone-900 text-[11px] font-semibold rounded-lg"
                                            >
                                                閉じる
                                            </button>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        )}

                        {/* 元資料・マップセクション */}
                        <section className="mt-14 bg-white dark:bg-stone-900 border border-stone-200/60 dark:border-stone-850 rounded-2xl p-5 sm:p-8 shadow-sm">
                            <div className="w-full text-left mb-4">
                                <span className="text-[10px] uppercase tracking-[0.2em] text-amber-700 dark:text-amber-500 font-bold block mb-1">SOURCE DATA</span>
                                <h2 className="font-serif text-xl font-semibold text-stone-900 dark:text-stone-100">
                                    マップ
                                </h2>
                                <div className="text-xs text-stone-500 mt-2 space-y-1">
                                    <p>個人で手元に記録していた、全12エリアの系統コードと営業時間の対比一覧表（2026年5月31日時点）です。</p>
                                    <p className="pt-0.5">
                                        <span>詳細・最新の公式情報は公式サイトをご覧ください：</span>
                                        <a 
                                            href="https://www.oc-ogawa.co.jp/ocl-takanawa/" 
                                            target="_blank" 
                                            rel="noopener noreferrer" 
                                            className="text-amber-700 dark:text-amber-500 font-semibold underline hover:text-amber-600 transition-colors ml-0.5"
                                        >
                                            https://www.oc-ogawa.co.jp/ocl-takanawa/
                                        </a>
                                    </p>
                                </div>
                            </div>
                            
                            {/* 横並び配置用のコンテナ */}
                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start mt-5">
                                {/* 左側：ラボ番号リスト（スタイルをシンプルに固定） */}
                                <div className="lg:col-span-5 bg-stone-50 dark:bg-stone-950 p-5 rounded-xl border border-stone-200/40 dark:border-stone-850">
                                    <h3 className="text-[10px] font-bold uppercase tracking-wider text-stone-500 dark:text-stone-400 mb-3 pb-1.5 border-b border-stone-200/60 dark:border-stone-850">
                                        エリア・コード対照表 (番号順)
                                    </h3>
                                    <ul className="space-y-3 font-sans text-xs text-stone-600 dark:text-stone-400">
                                        {AREA_DATA.map((store, i) => (
                                            <li key={store.id} className="flex items-start space-x-2.5">
                                                <span className="flex-shrink-0 flex items-center justify-center w-4 h-4 bg-stone-200 dark:bg-stone-800 text-stone-600 dark:text-stone-400 rounded-full text-[9px] font-bold mt-0.5">
                                                    {i + 1}
                                                </span>
                                                <div>
                                                    <div className="font-medium text-stone-800 dark:text-stone-200 text-xs">{store.name}</div>
                                                    <div className="font-mono text-stone-400 text-[9px] -mt-0.5">{store.code}</div>
                                                </div>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                                
                                {/* 右側：マップ画像 */}
                                <div className="lg:col-span-7 w-full space-y-3">
                                    <div className="overflow-hidden rounded-xl border border-stone-200/60 dark:border-stone-850 bg-stone-100 dark:bg-stone-950 p-1">
                                        <img 
                                            src="ogawa-map.jpeg" 
                                            alt="元資料の営業時間表" 
                                            className="w-full h-auto max-h-[600px] object-cover object-center rounded-lg dark:opacity-85"
                                            onError={(e) => {
                                                e.target.style.display = 'none';
                                            }}
                                        />
                                    </div>
                                    
                                    {/* 追記された案内テキスト */}
                                    <div className="bg-amber-50/40 dark:bg-amber-950/10 border border-amber-500/10 rounded-xl p-3.5 text-xs text-amber-900 dark:text-amber-400 leading-relaxed font-medium">
                                        ✧がついているお店は注文のために専用QRコードがある席を確保してください。その他のお店はテイクアウトしてお好きなところで食べられます。
                                    </div>
                                </div>
                            </div>
                        </section>

                    </main>

                    {/* フッター */}
                    <footer className="mt-16 border-t border-stone-200/40 dark:border-stone-900/40 pt-6 text-center text-[10px] text-stone-400">
                        <div className="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center space-y-2 sm:space-y-0">
                            <div>
                                <p>© 2026 OGAWA COFFEE LABORATORY 営業時間備忘録 (非公式ファンページ)</p>
                            </div>
                            <div>
                                <span className="font-mono">※当サイトの内容は個人の調査による備忘録です。最新の正確な情報は公式発表をご確認ください。</span>
                            </div>
                        </div>
                    </footer>

                </div>
            );
        }

        // Reactマウント
        const root = ReactDOM.createRoot(document.getElementById('root'));
        const AppWithBabel = App;
        root.render(<AppWithBabel />);
    </script>
</body>
</html>
